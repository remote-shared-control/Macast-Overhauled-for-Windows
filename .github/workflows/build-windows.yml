name: Build Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements/windows-lock.txt
      - run: python tools/fetch_mpv.py
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Macast-Overhauled-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
